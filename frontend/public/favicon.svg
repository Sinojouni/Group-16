<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Cinema Clapperboard / Film Frame -->
  <g filter="url(#shadow)" transform="translate(64, 76)">
    <!-- Main Screen Body -->
    <rect x="0" y="80" width="384" height="280" rx="32" fill="#111827" stroke="rgba(255,255,255,0.15)" stroke-width="6"/>
    
    <!-- Clapper Top Bar -->
    <g transform="rotate(-6, 0, 80)">
      <rect x="0" y="16" width="384" height="64" rx="16" fill="#1f2937" stroke="rgba(255,255,255,0.2)" stroke-width="4"/>
      <!-- Clapper Stripes -->
      <path d="M 60 16 L 90 80 M 130 16 L 160 80 M 200 16 L 230 80 M 270 16 L 300 80 M 340 16 L 370 80" stroke="#dc2626" stroke-width="14" stroke-linecap="round"/>
    </g>

    <!-- Glowing Play / Star in Center -->
    <circle cx="192" cy="220" r="70" fill="url(#bg)" opacity="0.9"/>
    
    <!-- Golden 5-Point Star -->
    <path d="M 192 170 L 204 206 L 242 206 L 211 228 L 223 264 L 192 242 L 161 264 L 173 228 L 142 206 L 180 206 Z" fill="url(#gold)"/>
  </g>
</svg>
